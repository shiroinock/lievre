<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>lievre</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--lv-bg);
        color: var(--lv-text);
        font-family: var(--font-sans);
        overflow: hidden;
      }
      .cover {
        position: relative;
        height: 288px;
        overflow: hidden;
      }
      .art {
        position: absolute;
        top: 0;
        left: 480px;
        width: 480px;
        height: 288px;
        overflow: hidden;
      }
      .art svg {
        display: block;
        width: 480px;
        height: 288px;
      }
      .accent {
        fill: var(--lv-accent);
      }
      .deep {
        fill: var(--lv-text);
      }
      .tint {
        fill: var(--lv-accent-soft);
      }
      .state {
        fill: var(--lv-success);
      }
      .cut {
        fill: var(--lv-bg);
      }
      .rule {
        stroke: var(--lv-border-strong);
        stroke-width: 1;
      }
      .words {
        position: absolute;
        left: 32px;
        bottom: 32px;
        max-width: 440px;
      }
      .name {
        margin: 0;
        font-size: 120px;
        line-height: 0.92;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--lv-text);
      }
      .tag {
        margin: 12px 0 0 6px;
        font-size: 14px;
        line-height: 24px;
        color: var(--lv-muted);
      }
    </style>
  </head>
  <body>
    <div class="cover">
      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 480 288" width="480" height="288">
          <!--
  blocks      lv-accent 176×232 bled off the top (the ultramarine, largest) · lv-text 256×168 bleeding off the right edge (the deep ink of Paper, the light ink of Ink) · lv-accent-soft 128×48 (the tint) · lv-success 48×16 once (it only ever means a state) — about 30% of 960×288
  arrangement a flush modular panel: one tall slab and one wide plate on a shared top line, satellites below on one baseline, lv-space-4 gutters
  pattern     the 1:2 monospace cell, from "英数字は 0.5em、日本語は 1em でちょうど 1:2": rows of 8-wide (Latin) and 16-wide (Japanese) cells cut out of the ink plate at the 24px body line, plus three hairline rules (lv-border-strong) across the slab, from "面と線で階層をつくる"
  scales      sides in lv-space-2 multiples on the 4px grid; gutters lv-space-4; line pitch 24px (lv-line-body at 14px); corners lv-radius-lg on blocks, lv-radius-sm on cells and the state chip
-->
          <rect class="accent" x="16" y="-8" width="176" height="232" rx="8" />
          <line class="rule" x1="16" y1="240.5" x2="192" y2="240.5" />
          <line class="rule" x1="16" y1="256.5" x2="192" y2="256.5" />
          <line class="rule" x1="16" y1="272.5" x2="128" y2="272.5" />
          <rect class="deep" x="208" y="56" width="288" height="168" rx="8" />

          <rect class="cut" x="252" y="80" width="16" height="16" rx="3" />

          <rect class="cut" x="232" y="104" width="8" height="16" rx="3" />

        </svg>
      </div>
      <div class="words">
        <h1 class="name">lievre</h1>

      </div>
    </div>
  </body>
</html>
