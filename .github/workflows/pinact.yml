# Fails a PR when a workflow uses an action by a tag or branch instead of a commit SHA.
# Fix it with `pinact run` (nix run github:shiroinock/workflows#pinact -- run).
# The job lives in shiroinock/workflows; change it there, not here. Pinned to a commit that was
# read, like the other workflows that call it; Renovate raises the SHA in all of them together.
name: アクションの固定

on:
  # Every PR, not only ones that touch .github: a required check has to report on all of them.
  pull_request:

permissions: {}

jobs:
  pinact:
    uses: shiroinock/workflows/.github/workflows/pinact.yml@a821dd9a547791f54327e2d976b094683c410ad2
    permissions:
      contents: read
    with:
      workflows_ref: a821dd9a547791f54327e2d976b094683c410ad2
