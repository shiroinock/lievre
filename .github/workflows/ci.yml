name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A merge made with GITHUB_TOKEN (merge-reservation.yml) starts no push run, so that workflow
  # starts this one on main by hand.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright cannot install Chromium yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: 型の検査
        run: npm run typecheck

      - name: lint（stylelint・ESLint）
        run: npm run lint

      # Every workspace: tokens (node --test), react (jsdom), tui (renderToString and contrast).
      - name: テスト（tokens・react・tui）
        run: npm test

      # The browser is keyed on the installed Playwright version, so it is only downloaded again
      # when package-lock.json moves Playwright. npm installs it once, at the repository root.
      - name: Playwright の版を調べる
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright のブラウザをキャッシュから戻す
        id: browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Chromium を入れる
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Chromium の依存ライブラリを入れる
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 配置の検査（ブラウザ）
        run: npm run test:layout

      - name: build（react の lib・デモ・Storybook、tui の lib）
        run: >-
          npm run build:lib -w packages/react &&
          npm run build:demo -w packages/react &&
          npm run build:storybook -w packages/react &&
          npm run build -w packages/tui

      - name: npm pack の中身
        run: npm run check:pack -w packages/react
