name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A merge made with GITHUB_TOKEN (merge-reservation.yml) starts no push run, so that workflow
  # starts this one on main by hand.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright cannot install Chromium yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 型の検査
        run: pnpm run typecheck

      - name: lint（stylelint・ESLint）
        run: pnpm run lint

      # Every workspace: tokens (node --test), react (jsdom), tui (renderToString and contrast).
      - name: テスト（tokens・react・tui）
        run: pnpm test

      # The browser is keyed on the installed Playwright version, so it is only downloaded again
      # when pnpm-lock.yaml moves Playwright. It is a dependency of @lievre/react, so read it there.
      - name: Playwright の版を調べる
        id: playwright
        working-directory: packages/react
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright のブラウザをキャッシュから戻す
        id: browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Chromium を入れる
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @lievre/react exec playwright install --with-deps chromium

      - name: Chromium の依存ライブラリを入れる
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @lievre/react exec playwright install-deps chromium

      - name: 配置の検査（ブラウザ）
        run: pnpm run test:layout

      - name: build（react の lib・デモ・Storybook、tui の lib）
        run: >-
          pnpm --filter @lievre/react run build:lib &&
          pnpm --filter @lievre/react run build:demo &&
          pnpm --filter @lievre/react run build:storybook &&
          pnpm --filter @lievre/tui run build

      - name: pnpm pack の中身
        run: pnpm --filter @lievre/react run check:pack
