# Turns on auto-merge for PRs labelled マージ予約 once they point at main.
# The job lives in shiroinock/workflows; change it there, not here. Pinned to a commit that was
# read; see claude.yml for how to update. workflows_ref must be the same SHA: the job checks out
# the script from shiroinock/workflows separately, and would take main's otherwise.
name: マージ予約

on:
  # pull_request_target: forks get a token that can merge too. No code from the PR is checked out
  # or run; the script comes from shiroinock/workflows.
  pull_request_target:
    types: [labeled, edited, ready_for_review, reopened, closed]
  # What GITHUB_TOKEN merged sends no events, so the PR stacked on it is picked up by this.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  reserve:
    uses: shiroinock/workflows/.github/workflows/merge-reservation.yml@eb1ef0dc284c9b116968b388815528b17e3df135
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      ci_workflow: ci.yml # accepts workflow_dispatch
      workflows_ref: eb1ef0dc284c9b116968b388815528b17e3df135
