# Fails a PR when the hash of the pnpm deps in flake.nix no longer matches pnpm-lock.yaml (Renovate
# raises the lockfile but not the hash). Fix it with
# `nix run github:shiroinock/workflows#nix-hashes -- --fix .#default.pnpmDeps`.
# The job lives in shiroinock/workflows; change it there, not here. Pinned to a commit that was
# read, like the other workflows that call it; Renovate raises the SHA in all of them together.
name: Nix のハッシュ

on:
  # Every PR: a required check has to report on all of them.
  pull_request:

permissions: {}

jobs:
  hashes:
    uses: shiroinock/workflows/.github/workflows/nix-hashes.yml@37d94d049d54bbd7c8453ad4929d8afbd9fed472
    permissions:
      contents: read
    with:
      # Only the pnpm deps: fetching them is enough to compare the hash, and quicker than the build.
      installables: .#default.pnpmDeps
      workflows_ref: 37d94d049d54bbd7c8453ad4929d8afbd9fed472
