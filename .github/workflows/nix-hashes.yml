# Fails a PR when Nix cannot fetch what package-lock.json lists. flake.nix holds no npmDepsHash:
# importNpmLock fetches each package by its integrity in the lockfile, so a lockfile Renovate
# raised needs nothing else. This builds .#default.npmDeps on an empty store, which fetches every
# package and checks its integrity, and catches a dependency Nix cannot fetch (a URL tarball the
# flake does not handle yet). A hash that a later fixed-output derivation adds is caught too; fix
# it with `nix run github:shiroinock/workflows#nix-hashes -- --fix .#default.npmDeps`.
# The job lives in shiroinock/workflows; change it there, not here. Pinned to a commit that was
# read, like the other workflows that call it; Renovate raises the SHA in all of them together.
name: Nix のハッシュ

on:
  # Every PR: a required check has to report on all of them.
  pull_request:

permissions: {}

jobs:
  hashes:
    uses: shiroinock/workflows/.github/workflows/nix-hashes.yml@b586023844ba16a3a650bfa3db021be733a5f8aa
    permissions:
      contents: read
    with:
      # Only the npm deps: fetching them is enough, and quicker than the build.
      installables: .#default.npmDeps
      workflows_ref: b586023844ba16a3a650bfa3db021be733a5f8aa
