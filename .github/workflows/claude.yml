# The owner's @claude in an issue, a PR comment or a review runs Claude Code.
# The job lives in shiroinock/workflows; change it there, not here.
# Pinned to a commit that was read, not @main: the job gets CLAUDE_CODE_OAUTH_TOKEN, so a change
# there must not reach this public repository unseen. To update, read the new commit and replace
# the SHA in all three workflows (claude.yml, claude-code-review.yml, merge-reservation.yml).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    uses: shiroinock/workflows/.github/workflows/claude.yml@eb1ef0dc284c9b116968b388815528b17e3df135
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
