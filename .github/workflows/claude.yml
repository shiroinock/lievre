# The owner's @claude in an issue, a PR comment or a review runs Claude Code.
# The job lives in shiroinock/workflows; change it there, not here.
# Pinned to a commit that was read, not @main: the job gets CLAUDE_CODE_OAUTH_TOKEN, so a change
# there must not reach this public repository unseen. Changes there are read in their own PRs;
# Renovate then raises the SHA in all four workflows together (claude.yml, claude-code-review.yml,
# claude-fix-ci.yml and merge-reservation.yml, whose workflows_ref too).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    uses: shiroinock/workflows/.github/workflows/claude.yml@fc90f001095834fdd37233fc09d6b3067ffb8203
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
