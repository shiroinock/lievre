# Stops PRs that change what apps receive without a fragment in changes/, and new lines in the
# 「未公開」 of CHANGELOG.md (they go in a fragment).
# It also runs when the description is edited, so adding the opt-out line reruns only this check.
name: 変更履歴

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The pull_request checkout is the merge commit, so HEAD^1 is the base and HEAD^1..HEAD is
      # exactly what the PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # The body goes through env, never into the script text, so it cannot inject shell.
      # GitHub sets GITHUB_HEAD_REF to the PR's branch; the message names the fragment after it.
      - name: 変更履歴の断片の書き忘れと書き方
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-changelog.mjs HEAD^1 HEAD
