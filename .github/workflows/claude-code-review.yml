# Claude Code reviews every ready PR, and labels it マージ予約 when nothing needs fixing.
# The jobs live in shiroinock/workflows; change them there, not here. Pinned to a commit that was
# read; see claude.yml for how to update.
name: Claude のレビュー

on:
  # pull_request (not pull_request_target): a fork's PR gets no secrets, and is skipped too.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    uses: shiroinock/workflows/.github/workflows/claude-review.yml@c40329d99e08e33dfd93fa0a067ebe1f905b0305
    # The most any of its jobs needs; each job narrows it to its own.
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: write
      id-token: write
    with:
      review_focus: |
        - WCAG 2.x AA：文字のコントラスト 4.5:1、輪郭とフォーカスの表示 3:1、色だけに頼らない、`prefers-reduced-motion` で動きを減らす。
        - キーボード操作と ARIA：Tab の順、矢印・Enter・Escape、role と aria-* の正しさ、フォーカスの戻り先。
        - 部品の props の `/** */` の説明と、`npm run llms` で書き出す `llms.txt` の更新。`tokens.css` を変えたら `tokens.json` の更新。
        - 変更履歴：利用する側に見える変更は `changes/` に PR ごとの断片が1つあるか（`changes/README.md`）。`CHANGELOG.md` の「未公開」には書かない。見えないなら PR の説明に「変更履歴：なし（理由）」。
        - 片側だけの色の帯（左や上だけに色の付いた border を引いて強調する飾り）を使っていないか。
        - 4px の格子：高さ・余白・間隔がトークン（`--lv-space-*`、`--lv-control-height`）か 4px の倍数か。等幅の英数字と日本語の幅が 1:2 にそろう決まり（`DESIGN.md`）を崩していないか。
        - 改名の前の名前を書いていないか（`MIGRATION.md`）。
        - 文書・コメント・ラベルが日本語で、英大文字の飾りラベルを使っていないか。
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
