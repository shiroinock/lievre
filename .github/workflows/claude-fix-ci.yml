# When the CI of a PR fails, Claude Code tries to fix the branch and push. When it cannot, it
# mentions the owner on the PR and labels it 人の手が要る; remove the label after fixing it by hand.
# The job lives in shiroinock/workflows; change it there, not here. Pinned to a commit that was
# read, like the other workflows that call it; Renovate raises the SHA in all of them together.
name: Claude で CI を直す

on:
  # Runs from main's copy of this file, with secrets; the job itself only takes branches of this
  # repository whose PR a person opened (not drafts, not bots).
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  fix:
    uses: shiroinock/workflows/.github/workflows/claude-fix-ci.yml@d910d91a634e6bf5f7e7a8be091255d69334980f
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
