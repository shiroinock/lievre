# Fails a PR when code matches the shared ast-grep rules, made from Claude's review findings that a
# static check catches cheaper. Fix it with `nix run github:shiroinock/workflows#rules -- --fix`.
# The job lives in shiroinock/workflows; change it there, not here. Pinned to a commit that was
# read, like the other workflows that call it; Renovate raises the SHA in all of them together.
name: 共通の静的ルール

on:
  # Every PR: a required check has to report on all of them.
  pull_request:

permissions: {}

jobs:
  rules:
    uses: shiroinock/workflows/.github/workflows/static-rules.yml@b586023844ba16a3a650bfa3db021be733a5f8aa
    permissions:
      contents: read
    with:
      workflows_ref: b586023844ba16a3a650bfa3db021be733a5f8aa
